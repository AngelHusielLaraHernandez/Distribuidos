syntax = "proto3";

package procesos;

service ProcesoService {
  rpc EnviarMensaje(EnviarMensajeRequest) returns (Ack);
  rpc RecibirMensaje(RecibirMensajeRequest) returns (Ack);
  rpc EventoInterno(EventoInternoRequest) returns (Ack);
  rpc Broadcast(BroadcastRequest) returns (Ack);
}

message EnviarMensajeRequest {
  string sender_id = 1;
  string receiver_id = 2;
  string mensaje = 3;
}

message RecibirMensajeRequest {
  string sender_id = 1;
  string mensaje = 2;
  repeated int64 reloj_vectorial = 3;
}

message EventoInternoRequest {
  string descripcion = 1;
}

message BroadcastRequest {
  string sender_id = 1;
  string mensaje = 2;
}

message Ack {
  bool ok = 1;
  string mensaje = 2;
  repeated int64 reloj_vectorial = 3;
}